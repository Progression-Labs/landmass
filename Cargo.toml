[workspace]
members = [
    "crates/landmass",
    "crates/bevy_landmass",
    "crates/landmass_rerecast",
]
resolver = "2"

# rerecast rides bevy main as this fork does: the org's fork, on the branch zero's manifest
# names for it.
[patch.crates-io]
bevy_rerecast = { git = "https://github.com/Progression-Labs/rerecast", branch = "bevy-main" }
bevy_rerecast_core = { git = "https://github.com/Progression-Labs/rerecast", branch = "bevy-main" }

# Bevy as the game builds it: the org's fork, on the branch zero's manifest names, every crate
# of it (a crate left on upstream main mixes two bevys). Its glam is the one rerecast and the
# game share.
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
